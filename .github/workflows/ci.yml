name: CI

# Step 2.4: the one and only workflow. Lint PHP, test + build the frontend, scan for
# secrets. Deploys are NOT done from CI - they run from the owner's PC with
# scripts/deploy.sh (Hostinger blocks SSH from GitHub runners anyway).
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint (8.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: php -l every file under public_html/api and tools
        run: |
          set -euo pipefail
          php -v | head -1
          COUNT=$(find public_html/api tools -name '*.php' | wc -l)
          echo "Linting $COUNT PHP files"
          find public_html/api tools -name '*.php' -print0 | xargs -0 -n1 php -l

  frontend:
    name: "Frontend (Node 20): test + build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: Unit tests (vitest)
        run: npm run test:run

      - name: Production build (vite)
        run: npm run build

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the checked-out tree
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner

      - name: Scan the full git history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
