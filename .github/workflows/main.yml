name: CI

# Step 0.3: secret scanning on every push and pull request. Build/test jobs are added in step 2.4.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the checked-out tree
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner

      - name: Scan the full git history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
